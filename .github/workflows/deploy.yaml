name: Build and Push Image

on:
  push:
    branches:
      - main
      - staging

env:
  IMAGE_NAME: flask-app
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_full: ${{ steps.meta.outputs.full }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "full=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Check secrets are set (debug)
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then echo "DOCKERHUB_USERNAME is EMPTY"; else echo "DOCKERHUB_USERNAME is set"; fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then echo "DOCKERHUB_TOKEN is EMPTY"; else echo "DOCKERHUB_TOKEN is set"; fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ${{ steps.meta.outputs.full }} ./first-task/app

      - name: Push image
        run: |
          docker push ${{ steps.meta.outputs.full }}

  # Staging deploys automatically off the "staging" branch — no approval needed
  ready-for-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - name: Image ready for staging
        run: |
          echo "Image pushed: ${{ needs.build-and-push.outputs.image_full }}"
          echo "Go to the Ghaymah dashboard -> Deploy New Application -> Container Image"
          echo "and paste this image tag to deploy to staging."

  # Production requires manual approval (configured as a GitHub Environment
  # protection rule, see notes.md). Once approved, this job just prints the
  # image tag -- the actual deploy click happens on the Ghaymah dashboard,
  # since there's no confirmed API/CLI for automated deploys yet.
  ready-for-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Image approved and ready for production
        run: |
          echo "Image pushed: ${{ needs.build-and-push.outputs.image_full }}"
          echo "Approved for production -- go to the Ghaymah dashboard -> Deploy New Application"
          echo "-> Container Image, paste this image tag, and click Deploy Now."
